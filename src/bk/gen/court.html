<!doctype html><html><head><style>
html,body{margin:0}
.s{width:1200px;height:1500px;position:relative;overflow:hidden;background:#0a3f73;perspective:1400px}
.sky{position:absolute;inset:0 0 auto 0;height:560px;background:#06284a}
.sky:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 2px,transparent 2px 150px)}
.court{position:absolute;left:50%;top:-300px;width:900px;height:1800px;margin-left:-450px;transform:rotateX(60deg);transform-origin:50% 100%;background:#2aaee6;
 box-shadow:0 0 0 220px #1d8fc4}
.court:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0 3px,transparent 3px 9px)}
.l{position:absolute;background:#fff}
.net{z-index:5;position:absolute;left:50%;top:640px;width:1040px;height:90px;margin-left:-520px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 2px,transparent 2px 14px),repeating-linear-gradient(0deg,rgba(255,255,255,.55) 0 2px,transparent 2px 14px);border-top:10px solid #fff}
.ball{z-index:6;position:absolute;left:640px;top:1090px;width:120px;height:120px}
.sh{z-index:6;position:absolute;left:600px;top:1190px;width:160px;height:34px;border-radius:50%;background:rgba(0,20,50,.35);filter:blur(8px)}
</style></head><body><div class="s">
<div class="sky"></div>
<div class="court">
 <div class="l" style="left:0;top:0;width:8px;height:100%"></div>
 <div class="l" style="right:0;top:0;width:8px;height:100%"></div>
 <div class="l" style="left:0;top:0;width:100%;height:8px"></div>
 <div class="l" style="left:0;top:300px;width:100%;height:8px"></div>
 <div class="l" style="left:446px;top:300px;width:8px;height:600px"></div>
 <div class="l" style="left:0;top:1500px;width:100%;height:8px"></div>
 <div class="l" style="left:446px;top:900px;width:8px;height:600px"></div>
</div>
<div class="net"></div>
<div class="sh"></div>
<img class="ball" src="file:///home/claude/bk/assets/ball.svg">
</div></body></html>
